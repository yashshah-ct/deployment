apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: production
data:
  POSTGRES_USER: "appuser"
  POSTGRES_DB: "users"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: production
data:
  init-orders-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE orders;" || true
