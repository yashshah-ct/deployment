apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: production
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      protocol: TCP
      name: amqp
    - port: 15672
      targetPort: 15672
      protocol: TCP
      name: management
  selector:
    app: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: production
  labels:
    app: rabbitmq
spec:
  clusterIP: None
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
  selector:
    app: rabbitmq
